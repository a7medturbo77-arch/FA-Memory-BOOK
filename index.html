<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Memory Book</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--pw:180px;--ink:#000;--gold:#c9a24b;--navy:#101d42;--paper:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{color-scheme:light only;height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at center,#16254a 0%,#060a16 88%);color:var(--ink);font-family:'Cormorant Garamond','IM Fell English',Georgia,serif;font-weight:500}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#book{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)*10/7);perspective:2400px;transition:transform .9s cubic-bezier(.5,0,.2,1)}
#book:before{content:"";position:absolute;left:2%;right:2%;bottom:-4%;height:6%;background:#000;filter:blur(18px);opacity:.65}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.55,.05,.25,1)}
.leaf.nt{transition:none}
/* PAGES: white */
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,0) 9%),#fff;
box-shadow:inset -1px 0 0 rgba(0,0,0,.12)}
.front{border-radius:0 5px 5px 0}
.back{transform:rotateY(180deg);border-radius:5px 0 0 5px;background:linear-gradient(270deg,rgba(0,0,0,.14),rgba(0,0,0,0) 9%),#fff}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#05070f,rgba(5,7,15,.2));opacity:0;pointer-events:none;transition:opacity .5s}
/* COVER: your image (upload cover.jpg next to index.html) */
.face.cover{background:url(cover.jpg) center/100% 100% no-repeat,#0e1a3a;border-radius:3px 9px 9px 3px;box-shadow:0 0 0 1px #050a1c}
/* INSIDE OF THE COVER */
.face.endp{background:url(inside.jpg) center/100% 100% no-repeat,#0b1634;border-radius:5px 0 0 5px}
.face.quote{background:url(first.jpg) center/100% 100% no-repeat,#e9d5a8;border-radius:0 5px 5px 0}
.face.pg{background:url(page.jpg) center/100% 100% no-repeat,#e9d5a8}
.face.pg.back{background:url(pageL.jpg) center/100% 100% no-repeat,#e9d5a8}
.ph{position:absolute;left:16.6%;top:13.5%;width:70%;height:72%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(60,40,15,.35)}
.L .ph{left:13.4%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 14px rgba(60,35,10,.35);pointer-events:none}
.plus{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-55%);background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.plus svg{width:100%;height:100%;overflow:visible}
.plus path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dr 2.2s .4s forwards ease}
.plus path+path{animation-delay:1.2s}
@keyframes dr{to{stroke-dashoffset:0}}
.hint{position:absolute;top:70%;width:100%;text-align:center;font-style:italic;font-weight:600;font-size:calc(var(--pw)*.07);color:#000}
.edit{position:absolute;bottom:19%;right:12%;background:none;border:0;border-bottom:1px solid #000;font:italic 600 calc(var(--pw)*.07) 'Cormorant Garamond',Georgia,serif;color:#000;padding:2px 0;cursor:pointer}
.L .edit{right:auto;left:12%}
#tip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);width:100%;text-align:center;color:var(--gold);font-style:italic;font-weight:600;font-size:18px;letter-spacing:.08em;opacity:.9;transition:opacity .5s;pointer-events:none}
#tip.h{opacity:0}
.ov{position:fixed;inset:0;background:rgba(3,5,12,.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.ov.on{display:flex}
.card{background:#fff;border-radius:6px;padding:18px;width:min(92vw,380px);max-height:90vh;overflow:auto;box-shadow:0 0 0 1px var(--gold),0 10px 40px #000;text-align:center;color:var(--ink);font-size:17px}
.card h2{margin:0 0 10px;font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.cw{background:#f1f1f1;padding:8%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
canvas{width:100%;display:block;touch-action:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]{width:90%;margin:14px 0 6px;accent-color:var(--navy)}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:10px;border:1px solid var(--navy);border-radius:4px;background:#fff;text-align:center;color:var(--ink)}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.bt{font:inherit;font-weight:600;font-size:18px;padding:9px 20px;border-radius:4px;border:1px solid var(--navy);background:none;color:var(--navy);cursor:pointer}
.bt.p{background:var(--navy);color:var(--gold)}
.bt:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.15);text-align:left}
.row img{width:36px;height:48px;object-fit:cover}
.row span{flex:1}
.row button{font-size:18px;width:36px;height:36px;border:1px solid rgba(0,0,0,.35);background:none;border-radius:4px;color:var(--ink)}
.small{font-size:15px;opacity:.8;margin:8px 0 0;font-style:italic}
</style>
</head>
<body>
<div id="stage"><div id="book"></div></div>
<div id="tip">swipe to open ›</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="ov" id="gate"><div class="card">
<h2>Our secret code</h2>
<input type="text" id="code" placeholder="e.g. rose-and-ivy-1907" autocapitalize="off" autocomplete="off" autocorrect="off">
<p class="small" id="gmsg">Type the same code on both phones. Anyone who knows it can open your book, so keep it private.</p>
<div class="btns"><button class="bt p" id="enter">Open the book</button></div>
</div></div>

<div class="ov" id="crop"><div class="card">
<h2>Place the photo</h2>
<div class="cw"><canvas id="cv" width="600" height="880"></canvas></div>
<input type="range" id="zm" min="1" max="4" step="0.01" value="1">
<p class="small">Drag to move · pinch or slide to zoom</p>
<div class="btns"><button class="bt" id="cx">Cancel</button><button class="bt p" id="ok">Confirm</button></div>
</div></div>

<div class="ov" id="ed"><div class="card">
<h2>Edit pages</h2>
<div id="list"></div>
<p class="small" id="none" style="display:none">No photo pages yet.</p>
<div class="btns"><button class="bt p" id="done">Done</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCxd2P5524mOaQiSfAdH466F_cVQ39lxDQ",
  authDomain: "memory-book-380d5.firebaseapp.com",
  projectId: "memory-book-380d5",
  storageBucket: "memory-book-380d5.firebasestorage.app",
  messagingSenderId: "554718255642",
  appId: "1:554718255642:web:7fb196ac2fc2cf20f14fa3"
};

var book=document.getElementById('book'),tip=document.getElementById('tip');
var photos=[],pages=[],leaves=[],cur=0,L=0,maxCur=0,PW=180,col=null,sig='',jump=false;

function size(){PW=Math.min(innerWidth*.46,innerHeight*.74*.7,440);document.documentElement.style.setProperty('--pw',PW+'px')}
size();addEventListener('resize',size);

/* ---------- shared storage (Firebase Firestore) ---------- */
function startFirebase(code){
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    col=firebase.firestore().collection('books').doc(code).collection('photos');
    col.orderBy('order').onSnapshot(function(snap){
      photos=snap.docs.map(function(d){return{id:d.id,src:d.data().src}});
      var s=photos.map(function(p){return p.id}).join(',');
      if(s===sig&&!jump&&pages.length)return;
      sig=s;buildPages();
      if(jump){cur=Math.min(maxCur,Math.ceil((2+photos.length)/2));jump=false}
      cur=Math.min(cur,maxCur);render();
      if(document.getElementById('ed').classList.contains('on'))listEdit();
    },function(err){alert('Could not reach the shared album: '+err.message)});
  }catch(e){alert('Setup problem: '+e.message)}
}
function cleanCode(v){return (v||'').toLowerCase().replace(/[^a-z0-9_-]/g,'')}
(function(){
  var c='';try{c=localStorage.getItem('bookcode')||''}catch(e){}
  buildPages();render();
  if(c.length>=6)startFirebase(c);else document.getElementById('gate').classList.add('on');
})();
document.getElementById('enter').onclick=function(){
  var c=cleanCode(document.getElementById('code').value);
  if(c.length<6){document.getElementById('gmsg').textContent='Please use at least 6 characters (letters, numbers, - or _).';return}
  try{localStorage.setItem('bookcode',c)}catch(e){}
  document.getElementById('gate').classList.remove('on');startFirebase(c);
};

/* ---------- pages ---------- */
function buildPages(){
  pages=['cover','inside','quote'];
  photos.forEach(function(o,i){pages.push({s:o.src,n:i+1})});
  pages.push('plus');
  var pi=pages.length-1;
  if(pi%2){pages.push('blank','blank')}else{pages.push('blank')}
  maxCur=Math.ceil(pi/2);
}
function html(p){
  if(p==='cover')return '';
  if(p==='quote')return '';
  if(p==='plus')return '<button class="plus" aria-label="Add photos"><svg viewBox="0 0 100 100"><path pathLength="100" d="M50 10C49 30 51 70 50 90"/><path pathLength="100" d="M10 51C30 49 70 52 90 50"/></svg></button><div class="hint">add a memory</div><button class="edit">edit</button>';
  if(p&&p.s)return '<div class="ph"><img alt="" src="'+p.s+'"></div>';
  return '';
}
function face(p,back){
  var d=document.createElement('div');
  d.className='face '+(back?'back L':'front')+(p==='cover'?' cover':p==='inside'?' endp':p==='quote'?' quote':' pg');
  d.innerHTML=html(p)+'<div class="shade"></div>';
  return d;
}
function render(){
  book.innerHTML='';leaves=[];L=pages.length/2;
  for(var k=0;k<L;k++){
    var l=document.createElement('div');l.className='leaf';
    l.appendChild(face(pages[2*k],false));l.appendChild(face(pages[2*k+1],true));
    book.appendChild(l);leaves.push(l);
  }
  apply(null,true);
}
function zOf(i){return i<cur?i:L-i}
function apply(moving,instant){
  leaves.forEach(function(l,i){
    if(instant)l.classList.add('nt');
    l.style.transform=i<cur?'rotateY(-180deg)':'';
    l.querySelectorAll('.shade').forEach(function(s){s.style.opacity=0});
    if(l===moving){l.style.zIndex=L+5;setTimeout(function(){l.style.zIndex=zOf(i)},950)}else l.style.zIndex=zOf(i);
  });
  book.style.transition=instant?'none':'';
  book.style.transform=cur===0?'translateX(-25%)':'';
  if(instant)requestAnimationFrame(function(){leaves.forEach(function(l){l.classList.remove('nt')});book.style.transition=''});
  tip.classList.toggle('h',cur!==0);
}
function go(dir){
  if(dir>0&&cur<maxCur){cur++;apply(leaves[cur-1])}
  else if(dir<0&&cur>0){cur--;apply(leaves[cur])}
}

/* ---------- swipe ---------- */
var d=null;
document.getElementById('stage').addEventListener('pointerdown',function(e){
  if(e.target.closest('button'))return;
  d={x:e.clientX,moved:false,leaf:null,dir:0,p:0};
});
addEventListener('pointermove',function(e){
  if(!d)return;var dx=e.clientX-d.x;
  if(!d.moved&&Math.abs(dx)>8){
    d.moved=true;d.dir=dx<0?1:-1;
    if(d.dir>0&&cur<maxCur)d.leaf=leaves[cur];
    else if(d.dir<0&&cur>0)d.leaf=leaves[cur-1];
    if(d.leaf){d.leaf.classList.add('nt');d.leaf.style.zIndex=L+5}
  }
  if(d.leaf){
    d.p=Math.min(1,Math.abs(dx)/(PW*1.4));
    var a=d.dir>0?-180*d.p:-180+180*d.p;
    d.leaf.style.transform='rotateY('+a+'deg)';
    var sh=Math.sin(Math.abs(a)*Math.PI/180)*.45;
    d.leaf.querySelectorAll('.shade').forEach(function(s){s.style.transition='none';s.style.opacity=sh});
  }
});
function end(e){
  if(!d)return;var s=d;d=null;
  if(!s.moved){var r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?1:-1);return}
  if(!s.leaf)return;
  var l=s.leaf;l.classList.remove('nt');
  l.querySelectorAll('.shade').forEach(function(x){x.style.transition=''});
  if(s.p>.28){cur+=s.dir}
  apply(l);
}
addEventListener('pointerup',end);
addEventListener('pointercancel',function(){if(d){var l=d.leaf;d=null;if(l){l.classList.remove('nt');apply(l)}}});

book.addEventListener('click',function(e){
  if(e.target.closest('.plus')){if(col)document.getElementById('file').click();else document.getElementById('gate').classList.add('on')}
  else if(e.target.closest('.edit'))openEdit();
});

/* ---------- placing a photo ---------- */
var queue=[],img=null,Z=1,ox=0,oy=0,base=1,cvs=document.getElementById('cv'),cx=cvs.getContext('2d'),zm=document.getElementById('zm');
document.getElementById('file').addEventListener('change',function(e){
  queue=Array.prototype.slice.call(e.target.files);e.target.value='';next();
});
function next(){
  if(!queue.length){document.getElementById('crop').classList.remove('on');return}
  var f=queue.shift(),u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){img=im;base=Math.max(600/im.width,880/im.height);Z=1;ox=0;oy=0;zm.value=1;draw();document.getElementById('crop').classList.add('on');URL.revokeObjectURL(u)};
  im.onerror=function(){next()};im.src=u;
}
function clampPos(){
  var w=img.width*base*Z,h=img.height*base*Z,mx=(w-600)/2,my=(h-880)/2;
  ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));
}
function draw(){
  clampPos();var w=img.width*base*Z,h=img.height*base*Z;
  cx.fillStyle='#fff';cx.fillRect(0,0,600,880);
  cx.drawImage(img,(600-w)/2+ox,(880-h)/2+oy,w,h);
}
zm.addEventListener('input',function(){Z=+zm.value;draw()});
var ptrs={},pd=0;
cvs.addEventListener('pointerdown',function(e){cvs.setPointerCapture(e.pointerId);ptrs[e.pointerId]=[e.clientX,e.clientY];pd=0});
cvs.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;var k=600/cvs.getBoundingClientRect().width,ids=Object.keys(ptrs);
  if(ids.length===1){ox+=(e.clientX-p[0])*k;oy+=(e.clientY-p[1])*k;ptrs[e.pointerId]=[e.clientX,e.clientY]}
  else{
    ptrs[e.pointerId]=[e.clientX,e.clientY];var a=ptrs[ids[0]],b=ptrs[ids[1]],dist=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pd){Z=Math.max(1,Math.min(4,Z*dist/pd));zm.value=Z}pd=dist;
  }
  draw();
});
function up(e){delete ptrs[e.pointerId];pd=0}
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);
document.getElementById('ok').onclick=function(){
  var b=this;b.disabled=true;b.textContent='Saving…';
  col.add({src:cvs.toDataURL('image/jpeg',.8),order:Date.now()}).then(function(){jump=true}).catch(function(e){alert('Could not save: '+e.message)}).then(function(){b.disabled=false;b.textContent='Confirm';next()});
};
document.getElementById('cx').onclick=function(){queue=[];next()};

/* ---------- edit pages ---------- */
function openEdit(){listEdit();document.getElementById('ed').classList.add('on')}
function reorder(arr){
  var batch=firebase.firestore().batch();
  arr.forEach(function(p,i){batch.update(col.doc(p.id),{order:i})});
  return batch.commit().catch(function(e){alert('Could not save: '+e.message)});
}
function listEdit(){
  var box=document.getElementById('list');box.innerHTML='';
  document.getElementById('none').style.display=photos.length?'none':'block';
  photos.forEach(function(o,i){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<img alt="" src="'+o.src+'"><span>Page '+(i+1)+'</span><button data-a="u">↑</button><button data-a="d">↓</button><button data-a="x">✕</button>';
    r.onclick=function(e){
      var a=e.target.getAttribute('data-a');if(!a)return;
      var arr=photos.slice();
      if(a==='x'){if(!confirm('Remove this page for both of you?'))return;col.doc(o.id).delete().catch(function(er){alert(er.message)});return}
      if(a==='u'&&i>0){var t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;reorder(arr)}
      if(a==='d'&&i<arr.length-1){var t2=arr[i+1];arr[i+1]=arr[i];arr[i]=t2;reorder(arr)}
    };
    box.appendChild(r);
  });
}
document.getElementById('done').onclick=function(){document.getElementById('ed').classList.remove('on')};
</script>
</body>
</html>
